_base_: qwen3_b200_base.yaml

experiment:
  method: cmt
  output_dir: outputs/cmt_opd

# Coupled Marginal Teachability uses conditional Student Top-K for local g_t.
# Its distinct raw-mass truncated common-mass kernel keeps the student/teacher
# Top-K union for sequential accessibility. The OPD loss remains exactly the
# configured Student Top-K; teacher-only tokens never enter the policy loss.
# Exact full-vocabulary reductions are opt-in diagnostics only.
rollout:
  num_responses: 4
  max_new_tokens: 4096
  vllm:
    gpu_memory_utilization: 0.60
    max_num_seqs: 64
    max_model_len: 5200
    max_concurrent_requests: 64

training:
  epochs: 3
  micro_batch_size_per_gpu: 16
  ppo_mini_batch_size: 64
  learning_rate: 5.0e-6
  save_interval: 150

training_evaluation:
  interval_steps: 150

selector:
  joint_cross_scoring: true
  pgt_vocab_chunk_tokens: 2048
  # Information budget for max_w <w,L> s.t. KL(w || uniform) <= epsilon.
  # Weights retain full support and are normalized to mean one within each
  # global PPO group (one allocation == one optimizer update).
  cmt_allocation_kl: 0.5
  # Production default: solve the bounded mean-one Gibbs problem directly.
  # "gibbs" and "bounded_gibbs" remain available as explicit legacy ablations.
  cmt_allocation_mode: direct_bounded_gibbs
  cmt_weight_min: 0.5
  cmt_weight_max: 2.0
  # Rollout-global robust scale is the 0.99 quantile of |D_t|; tanh bounds the
  # sequential correction before the per-PPO-group allocation.
  cmt_correction_mode: tanh_q99
  cmt_correction_quantile: 0.99
  # Used only by direct_bounded_gibbs; legacy modes keep cmt_allocation_kl.
  cmt_final_allocation_kl: 0.02
  # gamma=1 is the primary finite-response estimand: no artificial time
  # preference.  Lambda exposes (rather than hides) the relative value assigned
  # to unlocking one unit of downstream local learning opportunity.
  cmt_gamma: 1.0
  cmt_successor_lambda: 1.0
  # Optional full-vocabulary diagnostic only; the training score is support
  # matched and does not pay this O(B*T*V) reduction by default.
  cmt_full_vocab_diagnostics: false
